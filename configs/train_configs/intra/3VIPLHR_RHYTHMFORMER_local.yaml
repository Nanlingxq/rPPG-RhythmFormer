BASE: ['']
TOOLBOX_MODE: "train_and_test"

TRAIN:
  BATCH_SIZE: 4
  EPOCHS: 30
  LR: 5e-3
  MODEL_FILE_NAME: VIPL_RhythmFormer_fold5
  AUG: 1
  DATA:
    FS: 30
    DATASET: VIPL-HR
    DO_PREPROCESS: True
    DATA_FORMAT: NDCHW
    DATA_PATH: "/data/new_data/lwk/HREstimation/datasets/VIPL-HR"
    CACHED_PATH: "/data/new_data/lwk/HREstimation/preprocessed/VIPL-HR/train"
    EXP_DATA_NAME: ""
    BEGIN: 1.0
    END: 5.0
    PREPROCESS:
      DATA_TYPE: ['Standardized']
      LABEL_TYPE: Standardized
      DO_CHUNK: True
      CHUNK_LENGTH: 160
      CROP_FACE:
        DO_CROP_FACE: True
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False
      RESIZE:
        H: 128
        W: 128

VALID:
  DATA:
    FS: 30
    DATASET: VIPL-HR
    DO_PREPROCESS: False
    DATA_FORMAT: NDCHW
    DATA_PATH: "/data/new_data/lwk/HREstimation/datasets/VIPL-HR"
    CACHED_PATH: "/data/new_data/lwk/HREstimation/preprocessed/VIPL-HR/valid"
    EXP_DATA_NAME: ""
    BEGIN: 0.0
    END: 5.0
    PREPROCESS:
      DATA_TYPE: ['Standardized']
      LABEL_TYPE: Standardized
      DO_CHUNK: True
      CHUNK_LENGTH: 160
      CROP_FACE:
        DO_CROP_FACE: True
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False
      RESIZE:
        H: 128
        W: 128

TEST:
  METRICS: ['MAE', 'RMSE', 'MAPE', 'Pearson', 'SNR']
  USE_LAST_EPOCH: True
  DATA:
    FS: 30
    DATASET: VIPL-HR
    DO_PREPROCESS: True
    DATA_FORMAT: NDCHW
    DATA_PATH: "/data/new_data/lwk/HREstimation/datasets/VIPL-HR"
    CACHED_PATH: "/data/new_data/lwk/HREstimation/preprocessed/VIPL-HR/test"
    EXP_DATA_NAME: ""
    BEGIN: 0.0
    END: 5.0
    PREPROCESS:
      DATA_TYPE: ['Standardized']
      LABEL_TYPE: Standardized
      DO_CHUNK: True
      CHUNK_LENGTH: 160
      CROP_FACE:
        DO_CROP_FACE: True
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False
      RESIZE:
        H: 128
        W: 128

DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
LOG:
  PATH: "/data/new_data/lwk/HREstimation/RhythmFormer-main/runs/exp"
MODEL:
  DROP_RATE: 0.2
  NAME: RhythmFormer
INFERENCE:
  BATCH_SIZE: 4
  EVALUATION_METHOD: "FFT"
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: False
    WINDOW_SIZE: 10
  MODEL_PATH: ""
